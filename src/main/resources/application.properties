spring.application.name=skillsphere-backend
server.port=8080

# Database Configuration (MySQL default with fallback parameters)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillsphere?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security / JWT Configuration
jwt.secret=${JWT_SECRET:SkillSphereSuperSecretJwtKeyForAuthentication2026SecureBTechProjectKey12345}
jwt.expiration=${JWT_EXPIRATION:86400000}

# H2 Console Support
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
