spring.application.name=skillsphere-backend
server.port=${PORT:8080}

# Database Configuration (supports MySQL, PostgreSQL, or H2 dynamically)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillsphere?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate Configuration (Hibernate 6 auto-detects dialect based on active database)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security / JWT Configuration
jwt.secret=${JWT_SECRET:SkillSphereSuperSecretJwtKeyForAuthentication2026SecureBTechProjectKey12345}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration (allows Vercel production frontend and local dev)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,https://skill-sphere-frontend-five.vercel.app}

# H2 Console Support
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

