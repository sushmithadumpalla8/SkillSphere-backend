services:
  # SkillSphere Spring Boot Backend Web Service
  - type: web
    name: skillsphere-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillsphere-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://skill-sphere-frontend-five.vercel.app,http://localhost:3000,http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000

databases:
  # Render PostgreSQL Free Database Instance
  - name: skillsphere-db
    databaseName: skillsphere
    user: skillsphere_user
    plan: free
